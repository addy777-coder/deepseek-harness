# The dsh-web-app bundle adds the HTTP/browser carrier to dsh-gui-app.

- insert:
    # Select the native or browser directory picker from the resolved Web bind.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Parsed invocation values are ordinary services so dependent rows wait for
    # CLI argument resolution. `dsh --profile web --help` never binds a server.
    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # Resolve and serve the built frontend, publish the Web shell variables and
    # surface prompt, derive LAN trust, print the URL, and optionally open it.
    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    # HTTP bundle delivery and browser authentication/Host-Origin validation.
    - id: modules-web
      name: '@deepseek-ai/dsh-client-modules/web'

    - id: connection-web
      name: '@deepseek-ai/dsh-client-connection/web'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'
