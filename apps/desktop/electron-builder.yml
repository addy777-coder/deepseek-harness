appId: io.dsh.desktop
productName: DSH Desktop
electronVersion: 44.1.1
asar: true
directories:
  output: ../../apps/desktop/dist-electron
files:
  - lib/**
  - dist/**
  - assets/**
  - package.json
publish:
  provider: github
  owner: addy777-coder
  repo: deepseek-harness
  updaterCacheDirName: dsh-desktop-updater
extraResources:
  - from: vpn
    to: vpn
    filter:
      - '**/*'
  - from: ../desktop-runtime/package.json
    to: runtime/package.json
  - from: ../desktop-runtime/node_modules
    to: runtime/node_modules
    filter:
      - '**/*'
      - '!**/*.d.{ts,cts,mts}'
      - '!**/*.{map,tsbuildinfo,pdb}'
      - '!**/{test,tests,__tests__,coverage,bench,benchmark,benchmarks,example,examples,.github}/**/*'
  - from: pnpm
    to: pnpm
    filter:
      - '**/*'
      - '!**/*.d.{ts,cts,mts}'
      - '!**/*.{map,tsbuildinfo,pdb}'
      - '!**/{test,tests,__tests__,coverage,bench,benchmark,benchmarks,example,examples,.github}/**/*'
protocols:
  - name: DSH Desktop
    schemes:
      - dsh
win:
  icon: assets/icon.ico
  signExts:
    - '!dsh-vpn.exe'
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: DSH-Desktop-${version}-win-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  deleteAppDataOnUninstall: false
mac:
  icon: assets/icon.png
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  signIgnore:
    - '[\\/]vpn[\\/]dsh-vpn$'
  target:
    - dmg
    - zip
  artifactName: DSH-Desktop-${version}-mac-${arch}.${ext}
linux:
  icon: assets/icon.png
  executableName: dsh-desktop
  extraFiles:
    - from: assets/linux/AppRun
      to: AppRun
  category: Development
  maintainer: DSH Desktop contributors
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: DSH-Desktop-${version}-linux-${arch}.${ext}
appImage:
  executableArgs: []
deb:
  fpm:
    - --depends
    - zenity
npmRebuild: false
